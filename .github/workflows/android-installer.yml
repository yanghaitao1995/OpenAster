name: Retired 0.2.2 Android installer acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse withdrawn published installers
        shell: bash
        run: |
          echo "::error::The v0.2.2 release attachments were withdrawn. This historical acceptance workflow cannot run. Use mobile.yml to build and verify the current checkout candidates."
          exit 1
