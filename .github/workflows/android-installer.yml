name: Published 0.2.2 Android installer acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check the acceptance controls without starting an emulator
        run: node --test scripts/verify-published-android.test.mjs
      - name: Install the unchanged published APK and verify offline native UI
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          node scripts/verify-published-android.mjs
      - name: Retain installation, UI and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-installer-acceptance-0.2.2-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: android-installer-evidence/
