name: Windows command startup diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  command-diagnosis:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: diagnostic-tools
          persist-credentials: false
      - name: Checkout unchanged published implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3a4ee6915312dcafd9e56ea5c40440c9b39c5985
          path: published-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Prepare test-only overlay and source evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a4ee6915312dcafd9e56ea5c40440c9b39c5985'
          $actual = (& git -C published-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'Published source identity differs' }
          New-Item -ItemType Directory -Path command-evidence | Out-Null
          Copy-Item -LiteralPath diagnostic-tools/tests/command-runner.test.mjs -Destination published-source/tests/command-runner.test.mjs
          $changed = @(& git -C published-source diff --name-only)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -ne 'tests/command-runner.test.mjs') { throw 'Only the diagnostic test overlay may differ' }
          $hashes = @{}
          foreach ($file in @('core/command-runner.mjs', 'core/windows-command.mjs', 'core/windows-command-host.cs', 'tests/command-runner.test.mjs')) {
            $hashes[$file] = (Get-FileHash -LiteralPath (Join-Path published-source $file) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{ sourceCommit = $actual; verificationCommit = $env:GITHUB_SHA; hashes = $hashes; realModelCalls = 0 } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath command-evidence/source.json -Encoding utf8
      - run: npm install --global pnpm@11.25.0
      - name: Install fixed dependencies
        working-directory: published-source
        run: pnpm install --frozen-lockfile
      - name: Run original failure and four command regression files
        shell: pwsh
        working-directory: published-source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & node --test --test-concurrency=1 --test-reporter=tap --test-name-pattern='^real shell starts only after its checkpoint, returns Unicode, cwd, stderr and nonzero exit$' tests/command-runner.test.mjs 2>&1 | Tee-Object -FilePath ../command-evidence/targeted.log
          $targetedExit = $LASTEXITCODE
          & node --test --test-concurrency=1 --test-reporter=tap tests/command-runner.test.mjs tests/command-policy-runtime.test.mjs tests/windows-command.test.mjs tests/windows-command-lifetime.test.mjs 2>&1 | Tee-Object -FilePath ../command-evidence/command-regression.log
          $regressionExit = $LASTEXITCODE
          @{ targetedExitCode = $targetedExit; regressionExitCode = $regressionExit; originalTimeoutsPreserved = $true; realModelCalls = 0 } | ConvertTo-Json | Tee-Object -FilePath ../command-evidence/result.json
          if ($targetedExit -ne 0 -or $regressionExit -ne 0) { exit 1 }
      - name: Retain failure and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-command-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: command-evidence/
          if-no-files-found: error
          retention-days: 14
