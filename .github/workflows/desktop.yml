name: Desktop build validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node node_modules/electron/install.js
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2
      - run: pnpm test
      - name: Check installer verification policy
        run: node --test scripts/verify-release-installers.test.mjs scripts/verify-candidate-installers.test.mjs
      - name: Build desktop candidate
        id: build
        run: pnpm desktop:dist
      - name: Install and launch the Windows or macOS candidate
        if: always() && steps.build.outcome == 'success' && runner.os != 'Linux'
        env:
          OPENASTER_ACCEPTANCE_KIND: ${{ runner.os == 'Windows' && 'windows' || 'macos' }}
        run: node scripts/verify-candidate-installers.mjs
      - name: Install and launch the Linux DEB candidate
        if: always() && steps.build.outcome == 'success' && runner.os == 'Linux'
        env:
          OPENASTER_ACCEPTANCE_KIND: deb
        run: node scripts/verify-candidate-installers.mjs
      - name: Launch the Linux AppImage candidate
        # Keep the separate AppImage evidence even if DEB acceptance failed.
        if: always() && steps.build.outcome == 'success' && runner.os == 'Linux'
        env:
          OPENASTER_ACCEPTANCE_KIND: appimage
        run: node scripts/verify-candidate-installers.mjs
      - name: Retain candidate bytes and acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.os }}-${{ github.sha }}-${{ job.status }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            dist/public/build-info.json
            candidate-evidence/
