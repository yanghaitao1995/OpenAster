name: Mobile native build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: node mobile/native.mjs ${{ matrix.platform }}
      - name: Build Android debug APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd mobile/android
          bash gradlew --no-daemon assembleDebug
      - name: Build iOS simulator application
        if: matrix.platform == 'ios'
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath release/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            release/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
            mobile/www/build-info.json
