name: 缺陷报告
description: 提交使用合成数据即可复现的问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读仓库的 SECURITY.md。安全漏洞应使用私密报告渠道。
        不要填写 API 密钥、个人连接配置、公司资料、完整会话或未经脱敏的截图。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 发布版本、提交标识，或说明是本地修改版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器或桌面/移动端；源码运行时附 Node.js 版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 使用合成文件和测试数据；无需提供真实模型密钥。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期行为与实际结果
      description: 附上已脱敏的错误码或必要片段，并说明是否可以稳定复现。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查附件与文字，不包含凭据、个人敏感信息或未授权的组织资料。
          required: true
